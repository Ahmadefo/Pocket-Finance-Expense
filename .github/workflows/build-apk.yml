name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure lib Directory and Backup Main
        run: |
          mkdir -p lib
          if [ -f lib/main.dart ]; then
            cp lib/main.dart lib/main.dart.bak
          fi

      - name: Generate Android System
        run: flutter create . --project-name=pocket_expense --platforms=android --overwrite

      - name: Restore Custom Main
        run: |
          if [ -f lib/main.dart.bak ]; then
            cp lib/main.dart.bak lib/main.dart
          fi

      - name: Create Custom Pubspec
        run: |
          cat << 'EOF' > pubspec.yaml
          name: pocket_expense
          description: Pocket Expense App
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            intl: ^0.19.0
            fl_chart: ^0.66.0
            csv: ^6.0.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
